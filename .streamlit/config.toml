[theme]
base = "dark"
primaryColor = "#00D4FF"
showSidebarBorder = true

[theme.dark]
primaryColor = "#00D4FF"
backgroundColor = "#000000"
secondaryBackgroundColor = "#071827"
textColor = "#FFFFFF"
borderColor = "#19384D"

[theme.dark.sidebar]
backgroundColor = "#06111C"
secondaryBackgroundColor = "#102638"
textColor = "#FFFFFF"
borderColor = "#19384D"

[theme.light]
primaryColor = "#0077B6"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EDF6FC"
textColor = "#102A43"
borderColor = "#D5E4EF"

[theme.light.sidebar]
backgroundColor = "#F1F8FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#102A43"
borderColor = "#D5E4EF"